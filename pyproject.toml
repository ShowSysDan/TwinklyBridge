[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinkly-bridge"
version = "0.2.0"
description = "sACN / DDP to Twinkly and Twinkly Pro real-time bridge with a web UI, map export for Eos and xLights"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Flask==3.1.3", "python-dotenv==1.2.4"]

[project.scripts]
twinkly-bridge = "bridge.app:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.setuptools.package-data]
bridge = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
